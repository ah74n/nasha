<body class="text-zinc-400 font-sans antialiased overflow-x-hidden">

        <form action="https://formsubmit.co/erahsan313@gmail.com" method="POST" class="max-w-2xl bg-cardBg border border-zinc-800/50 p-8 md:p-10 rounded-[2rem] shadow-2xl relative overflow-hidden group hover:border-brand/40 transition-colors duration-500">

                <p class="text-xs text-zinc-600 uppercase tracking-widest font-bold">Koshur.</p>

            <div class="flex space-x-8 text-zinc-500 text-sm font-bold uppercase tracking-widest">

    <script>
        const blogData = [
            { id: 0, title: "How AI Actually Thinks", cat: "AI Security", date: "May 18, 2026", desc: "GPT-3 alone was trained on data that would take a human 2,600 years to read nonstop", 
            content: "Everyone uses AI, but few know how it works under the hood. It turns out, models like ChatGPT aren't actually thinking they are just massive next word prediction engines,When an LLM trains on text that would take a human 2,600 years to read, it doesn't read word-by-word. It uses Transformer Neural Networks to process whole libraries at once, assigning mathematical Attention Scores to understand context. When you type a prompt, the AI simply calculates the highest probability of what word should come next.Because AI relies entirely on data patterns it is incredibly fragile Attackers can corrupt the training data Data Poisoning or inject subtle noise to trick live models Adversarial Evasion As industries rush to adopt AI the next big cyber battlefield isn't just about blocking malware it is about protecting the data that feeds the machines" },
            { id: 1, title: "The $2.2M Security Weapon: Why Defenders Must Embrace AI", cat: "AI Security", date: "May 19, 2026", desc: "The ROI of AI in Modern Cyber Defense", 
            content: "Hackers might be using smarter tools, but the real advantage still belongs to the defenders. According to IBM’s latest report, organizations utilizing automated security operations save an average of $2.2 Million during a breach and cut containment times by 108 days. Systems like Splunk parse massive network anomalies at speeds humans can't match, flagging hidden indicators instantly.Advanced modeling flags obscure patterns and simulates outlier attack paths that teams often overlook during routine manual checks.The Catch: Right now, only 24% of these advanced initiatives are actually secured. Deploying smart tools without strict access frameworks like ISO/IEC 27090, MFA, or RBAC just opens up new vulnerabilities. To stay ahead, the focus needs to shift toward hardening the data pipelines themselves." },
            { id: 2, title: "AI vs AI Cyber Battle", cat: "AI security", date: "May 20, 2026", desc: "DarkBERT vs FraudGPT: The Dawn of Machine-on-Machine Warfare",
             content: "Cybersecurity has officially evolved past human speed. We are no longer just fighting human hackers using malicious scripts; we are entering an era of completely automated, machine-on-machine warfare on the dark web.The Cyber Weapon (FraudGPT): Operating with zero ethical guardrails, this unrestricted malicious model acts as a force multiplier for threat actors. It cuts down the technical barrier to entry by instantly writing obfuscated malware scripts and generating flawless, context-aware phishing pages.The Digital Guard (DarkBERT): Purpose-built by defensive researchers, this model was trained on 2.2 Terabytes of raw Dark Web data. It serves as an automated investigator, scanning illicit marketplaces and encrypted forums to decode hacker slang and flag active data breaches before they hit the mainstreamThe Reality Check: This isn't science fiction anymore it’s the current state of play. As malicious models attempt to dynamically evolve payloads to evade detection, the role of the modern defender is shifting away from manual log analysis. The future of the Blue Team depends entirely on engineering resilient data pipelines and deploying behavioral models capable of out-learning the adversary in real-time.`},
            { id:3, title: "Hidden Danger in AI Training ", date: "May 21 2026", desc: "the biggest security threat to modern AI isn't hackers, but the invisible data supply chain it was built on", 
             content:"Most organizations think AI security starts after deployment, completely missing that the real danger is permanently baked into the model's foundation during training. When developers scrape the public internet to build massive datasets like the 400-terabyte Common Crawl archive used for major models today—they accidentally sweep up massive amounts of sensitive information. Security researchers recently found nearly 12,000 live API keys and passwords in just a single month's archive of this web data. Because over 70% of popular AI datasets lack proper licensing or source tracking, companies have zero visibility into what they are actually feeding their systems. Once this raw, unfiltered data—including personal emails and corporate credentials—gets absorbed into a model's weights, it cannot be simply patched or deleted, making the adoption of an ML-BOM (Machine Learning Bill of Materials) an absolute necessity before deploying any third-party system."},
            { id:4, title: "Epochs, Overfitting, Quantisation, Pruning, Federated Learning", date: "June 05 2026", desc:"frequently used terms in ai training",
             content:"Training an AI is a delicate balancing act. We teach models by looping through datasets in complete passes called Epochs. However, if a model trains for too many epochs, it stops learning general rules and just memorizes the training data...a flaw known as Overfitting (like a student memorizing a practice test but failing the actual exam). Once a model is fully trained, it is usually too large for standard hardware, so engineers compress it. They use Pruning to cut away useless neural connections and Quantisation to lower the mathematical precision of the model (similar to compressing a heavy 4K video down to 1080p). Finally, to address massive privacy concerns, companies are adopting Federated Learning. Instead of collecting everyone's data in one central server, the model is sent to your local device to learn, sending only the lessons learned back to headquarters while keeping your raw data safely on your phone. "},
            {
             id: 5,
             title: "AI’s Silent Vulnerability",
             date: "June 06, 2026",
             desc:"Prompt Injection: The invisible command that hijacks logic",
             content:`The promise of Generative AI is built on its ability to follow instructions, but that same core functionality has introduced a critical security loophole known as Prompt Injection. Unlike traditional software exploits that target vulnerabilities in code, prompt injection targets the way an AI processes information. It works by embedding malicious, hidden commands into the text or "tokens" that an AI model consumes. These injections fall into two categories: Direct, where a user manually overrides the system to force unintended behaviors, and Indirect, a far more dangerous "zero-click" attack where the AI unknowingly absorbs malicious instructions from untrusted external sources like emails, web pages, or documents.
             Because language models treat all incoming data as a single stream of context rather than separating "commands" from "content," they often lack the architectural boundaries needed to distinguish between a developer's security policy and an attacker's crafted request. As organizations increasingly grant AI agents the power to access sensitive databases, browse the internet, and execute scripts, these injections have moved from being theoretical parlor tricks to high-stakes security threats, potentially leading to unauthorized data leaks, system compromise, and the silent manipulation of trusted AI outputs.`
            },
            {
              id: 6,
              title: "Pickle vs Safetensors",
              date: "14 June 2026",
              desc: "reating a Python .pkl file like a harmless asset is a critical security flaw. That is why .safetensors is the new standard",
              content: `When deploying machine learning models, the file format you choose fundamentally dictates your security posture. Python’s standard .pkl (pickle) format serializes both data and execution logic, meaning a backdoored model can silently execute arbitrary malware like a reverse shell the exact millisecond it is loaded into memory. To neutralize this threat, the industry standard has shifted to .safetensors, a secure alternative that stores only pure mathematical weights and JSON metadata with strictly zero execution capabilities. By recognizing that traditional model weights can act as hidden executables and strictly enforcing the use of .safetensors over .pkl, security teams can effectively eliminate one of the most critical arbitrary code execution vulnerabilities in the modern AI supply chain",
        
        ];

        // 1. Render Most Recent Blog on the Left Div
        const recentBlog = blogData[6]; // Gets the newest blog
        const recentContainer = document.getElementById('recent-blog-container');
        recentContainer.innerHTML = `
            <div class="p-8 md:p-20 cursor-pointer" onclick="openBlog(${recentBlog.id})">
                <span class="text-brand font-black text-[9px] md:text-[10px] tracking-widest uppercase mb-4 block">${recentBlog.cat || recentBlog.date}</span>
                <h3 class="text-3xl md:text-7xl font-black text-white mb-6 md:mb-8 tracking-tighter leading-tight md:leading-[0.9]">${recentBlog.title}</h3>
                <p class="text-zinc-500 text-sm md:text-xl max-w-xl mb-8 md:mb-10">${recentBlog.desc}</p>
                <div class="w-10 h-1 bg-brand shadow-[0_0_10px_#10b981]"></div>
            </div>
        `;

        // 2. Render All Blogs in a Standard Grid
        const grid = document.getElementById('mesh-grid');
        blogData.forEach(blog => {
            grid.innerHTML += `
                <div onclick="openBlog(${blog.id})" class="bg-cardBg border border-zinc-800/50 p-6 md:p-8 rounded-[1.5rem] md:rounded-[2rem] hover:border-brand/40 hacker-glow transition-all cursor-pointer group flex flex-col justify-between min-h-[200px]">
                    <div>
                        <span class="text-[8px] md:text-[9px] font-bold text-zinc-600 block mb-3 md:mb-4 tracking-widest uppercase">${blog.date}</span>
                        <h4 class="text-lg md:text-xl font-bold text-white group-hover:text-brand transition-colors">${blog.title}</h4>
                    </div>
                    <p class="text-zinc-500 text-xs md:text-sm mt-3 md:mt-4 line-clamp-2">${blog.desc}</p>
                </div>
            `;
        });

        // Modal Functions
        function openBlog(id) {
            const blog = blogData.find(b => b.id === id);
            document.getElementById('modal-content').innerHTML = `
                <span class="text-brand font-bold uppercase tracking-widest text-xs">${blog.cat || 'TECH'}</span>
                <h1 class="text-3xl md:text-6xl font-black text-white my-8 tracking-tighter">${blog.title}</h1>
                <div class="text-zinc-400 text-lg md:text-xl leading-relaxed">${blog.content}</div>
                <p class="mt-12 text-zinc-600 font-mono text-sm">TERMINAL_REF: 0x${blog.id}A4B2</p>
            `;
            document.getElementById('blog-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeBlog() {
            document.getElementById('blog-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
